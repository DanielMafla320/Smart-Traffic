# =============================================================================
# SmartTraffic - Nginx como reverse proxy (único punto de entrada público)
# -----------------------------------------------------------------------------
#   /            -> dashboard.html (archivo estático)
#   /api/...     -> user-dashboard-backend:8080 (REST)
#   /ws/...      -> user-dashboard-backend:8080 (WebSocket)
# El navegador solo conoce esta URL: los servicios internos quedan ocultos
# (transparencia de localización) y no publican puertos.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 30s;

    # --- Endurecimiento ------------------------------------------------------
    # No revelar la versión de Nginx en cabeceras ni páginas de error.
    server_tokens off;
    # Timeouts cortos: mitigan ataques de conexiones lentas (Slowloris).
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    client_max_body_size 1m;

    # Rate limiting: máximo 20 peticiones/s por IP a la API (ráfaga de 40).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    gzip on;
    gzip_types application/json text/css application/javascript;

    # Para WebSocket: si el cliente pide "Upgrade", se reenvía "upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Backend del dashboard (nombre de servicio de Docker Compose).
    upstream dashboard_backend {
        server user-dashboard-backend:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Cabeceras de seguridad.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        root /usr/share/nginx/html;
        index dashboard.html;

        # Bloquear archivos ocultos (.env, .git, ...).
        location ~ /\. {
            deny all;
            return 404;
        }

        # Dashboard (archivo estático).
        location = / {
            try_files /dashboard.html =404;
        }

        # API REST.
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://dashboard_backend;
            include /etc/nginx/snippets/proxy.conf;
            # Conexiones keepalive hacia el upstream.
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # WebSocket: el handshake HTTP necesita Upgrade y Connection.
        location /ws/ {
            proxy_pass http://dashboard_backend;
            include /etc/nginx/snippets/proxy.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # La conexión queda abierta; el servidor envía datos cada 5 s.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Salud de Nginx para el healthcheck de Docker (no se registra).
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
