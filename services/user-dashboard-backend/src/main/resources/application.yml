# Configuración para ejecutar desde el host (IDE o mvn spring-boot:run).
# Cada valor puede sobrescribirse con la variable de entorno indicada.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: user-dashboard-backend

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:smarttraffic}
    password: ${RABBITMQ_PASSWORD:smarttraffic_dev}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
    listener:
      simple:
        # Un mensaje que falla no se vuelve a encolar (evita un bucle infinito).
        default-requeue-rejected: false
        prefetch: 10

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:smarttraffic}
    # Usuario de SOLO LECTURA creado por database/init.sql.
    username: ${DASHBOARD_DB_USER:dashboard_reader}
    password: ${DASHBOARD_DB_PASSWORD:dashboard_dev}
    hikari:
      pool-name: dashboard-pool
      maximum-pool-size: 5
      read-only: true
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      # /actuator/health/liveness y /readiness para el healthcheck de Docker.
      probes:
        enabled: true

smarttraffic:
  dashboard:
    exchange: ${RABBITMQ_EXCHANGE:traffic_updates}
    queue: ${DASHBOARD_QUEUE:dashboard_traffic_queue}
    # Solo importa el último estado: la cola guarda como máximo 100 mensajes
    # y descarta los más viejos si el dashboard estuvo apagado mucho tiempo.
    queue-max-length: ${DASHBOARD_QUEUE_MAX_LENGTH:100}
    # Orígenes que pueden llamar a la API y abrir el WebSocket (CORS).
    allowed-origins: ${DASHBOARD_ALLOWED_ORIGINS:http://localhost,http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}
    history:
      default-range: ${HISTORY_DEFAULT_RANGE:PT1H}
      max-range: ${HISTORY_MAX_RANGE:P7D}
      max-results: ${HISTORY_MAX_RESULTS:500}

logging:
  level:
    com.smarttraffic: INFO
