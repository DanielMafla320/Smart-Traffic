spring:
  application:
    name: query-client
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
        default-requeue-rejected: false

logging:
  charset:
    console: UTF-8

traffic:
  rabbitmq:
    request-queue: query_traffic_queue
    answers-exchange: query_answers
  client:
    user-id: ${USER_ID:client_456}
    zone: ${CLIENT_ZONE:Zona A}
    destination-zone: ${CLIENT_DESTINATION_ZONE:Zona E}
    query-interval-ms: ${QUERY_INTERVAL_MS:15000}
